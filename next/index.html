<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#46665f"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./native.css"><link rel="stylesheet" href="./workflow.css"><link rel="stylesheet" href="./slip-extra.css"><title>買取レスキュー NEXT</title></head><body><div id="app">
<header class="top"><div><b>買取レスキュー NEXT</b><small id="status">Green検証環境・Blue読取のみ</small></div><button id="more">•••</button></header>
<main id="home" class="screen active"><section class="metrics"><button data-filter="reply"><span>要返信</span><strong id="reply">–</strong></button><button data-filter="new"><span>新規査定</span><strong id="new">–</strong></button><button data-filter="unscheduled"><span>日程未確定</span><strong id="unscheduled">–</strong></button></section><section class="head"><div><h1>今日の現場</h1><p id="todayLabel"></p></div><button data-tab="schedule">月間予定</button></section><div id="today"></div><section class="compat"><div><b>現行Blue</b><span>必要なら現在の予定表へ即切替</span></div><button class="compatOpen" data-blue="schedule">現行予定表を開く</button></section><section class="draft"><div><b>作業途中</b><span id="draftSummary">保存中のNEXT伝票はありません</span></div><button id="resume" disabled>続きから</button></section></main>
<main id="scheduleView" class="screen nativeScreen"><section class="nativeHead"><div><h1>予定</h1><p id="scheduleSync">Green読取データ</p></div><button data-blue="schedule">現行予定表</button></section><div class="monthNav"><button id="prevMonth">‹</button><b id="monthLabel"></b><button id="nextMonth">›</button></div><div class="weekHead"><span>月</span><span>火</span><span>水</span><span>金</span><span>土</span><span>日</span></div><div id="calendarGrid" class="calendarGrid"></div><section id="dayDetail" class="dayDetail"></section></main>
<main id="assessmentView" class="screen nativeScreen"><section class="nativeHead"><div><h1>査定</h1><p id="assessmentSync">Blueライブ＋Green読取</p></div><button data-blue="assessment">現行査定</button></section><div class="workflowSearch"><input id="assessmentSearch" placeholder="受付番号・名前・電話・商品を検索"></div><div id="assessmentFilters" class="workflowFilters"></div><div class="workflowMeta"><b id="assessmentCount">0件</b><span>次アクション順</span></div><div id="assessmentList" class="workflowList"></div></main>
<main id="slipsView" class="screen nativeScreen"><section class="nativeHead"><div><h1>伝票</h1><p id="slipsSync">Green読取データ</p></div><button data-blue="slips">現行伝票</button></section><div class="workflowSearch"><input id="slipSearch" placeholder="伝票番号・顧客名を検索"></div><div id="slipFilters" class="workflowFilters"></div><div class="workflowMeta"><b id="slipCount">0件</b><span>更新順</span></div><div id="slipList" class="workflowList"></div></main>
<main id="inventoryView" class="screen nativeScreen"><section class="nativeHead"><div><h1>在庫</h1><p id="inventorySync">Green読取データ</p></div><button data-blue="inventory">現行在庫</button></section><div class="inventorySearch"><input id="inventorySearch" placeholder="在庫番号・メーカー・型番・元伝票を検索"></div><div id="inventoryFilters" class="inventoryFilters"></div><div class="inventoryMeta"><b id="inventoryCount">0件</b><span>最近更新順</span></div><div id="inventoryList" class="inventoryList"></div><button id="inventoryMore" class="moreRows hidden">さらに表示</button></main>
<main id="module" class="screen"><div class="modulebar"><button id="back">‹</button><div><b id="moduleTitle"></b><small>現行Blue互換モード</small></div><button id="newSlip">NEXT伝票</button></div><iframe id="frame"></iframe></main>
<nav class="nav"><button class="active" data-tab="home">⌂<b>今日</b></button><button data-tab="schedule">▦<b>予定</b></button><button data-tab="assessment">⌕<b>査定</b></button><button data-tab="slips">✎<b>伝票</b></button><button data-tab="inventory">▣<b>在庫</b></button></nav></div>
<div id="drawer" class="overlay"><section><header><b>その他</b><button data-close="drawer">×</button></header><button data-tab="recycle">♻️ リサイクル料金</button><button data-tab="store">🛒 販売</button><button data-tab="settings">⚙️ 設定</button><button id="manualSlip">＋ NEXT伝票を手入力</button><p>既存Blue・LINE・Webhook・本番データは変更しません。</p></section></div>
<div id="slip" class="overlay"><section class="sheet"><header><div><b>NEXT伝票</b><small id="saveState">端末へ自動保存</small></div><button data-close="slip">×</button></header><div class="body"><div class="common"><label>お名前<input id="name"></label><label>電話<input id="phone"></label><label>住所<input id="address"></label><label>メール<input id="email"></label></div><div class="services"><b>今回の業務</b><div id="serviceButtons"></div></div><div id="serviceArea"></div><div class="total"><span>差引</span><b id="total">¥0</b></div></div><footer><button id="customerPreview">お客様確認</button><button id="saveDraft">下書き保存</button></footer></section></div>
<div id="preview" class="overlay"><section class="sheet preview"><header><b>お客様確認</b><button data-close="preview">×</button></header><div id="previewBody" class="body"></div></section></div><div id="listModal" class="overlay"><section class="compactSheet"><header><b id="listTitle">一覧</b><button data-close="listModal">×</button></header><div id="listBody" class="body"></div></section></div>
<script src="./draft-db.js"></script><script src="./core.js"></script><script src="./schedule.js"></script><script src="./inventory.js"></script><script src="./assessment.js"></script><script src="./slips.js"></script><script src="./slip.js"></script><script src="./workflow-router.js"></script></body></html>
