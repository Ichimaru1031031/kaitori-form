<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d32"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><title>買取レスキュー NEXT</title></head>
<body><div id="app">
<header class="top"><div><b>買取レスキュー NEXT</b><small id="status">Green検証環境・Blue読取のみ</small></div><button id="more">•••</button></header>
<main id="home" class="screen active">
<section class="metrics"><button data-filter="reply"><span>要返信</span><strong id="reply">–</strong></button><button data-filter="new"><span>新規査定</span><strong id="new">–</strong></button><button data-filter="unscheduled"><span>日程未確定</span><strong id="unscheduled">–</strong></button></section>
<section class="head"><div><h1>今日の現場</h1><p id="todayLabel"></p></div><button data-tab="schedule">月間予定</button></section>
<div id="today"></div>
<section class="compat"><div><b>本番予定表</b><span>現行Blueをそのまま表示</span></div><iframe id="schedulePreview" title="本番予定表"></iframe></section>
<section class="draft"><div><b>作業途中</b><span id="draftSummary">保存中のNEXT伝票はありません</span></div><button id="resume" disabled>続きから</button></section>
</main>
<main id="module" class="screen"><div class="modulebar"><button id="back">‹</button><div><b id="moduleTitle"></b><small>現行Blue互換モード</small></div><button id="newSlip">NEXT伝票</button></div><iframe id="frame"></iframe></main>
<nav class="nav"><button class="active" data-tab="home">⌂<b>今日</b></button><button data-tab="schedule">▦<b>予定</b></button><button data-tab="assessment">⌕<b>査定</b></button><button data-tab="slips">✎<b>伝票</b></button><button data-tab="inventory">▣<b>在庫</b></button></nav>
</div>
<div id="drawer" class="overlay"><section><header><b>その他</b><button data-close="drawer">×</button></header><button data-tab="recycle">♻️ リサイクル料金</button><button data-tab="store">🛒 販売</button><button data-tab="settings">⚙️ 設定</button><button id="manualSlip">＋ NEXT伝票を手入力</button><p>既存Blue・LINE・Webhook・本番データは変更しません。</p></section></div>
<div id="slip" class="overlay"><section class="sheet"><header><div><b>NEXT伝票</b><small id="saveState">端末へ自動保存</small></div><button data-close="slip">×</button></header><div class="body">
<div class="common"><label>お名前<input id="name"></label><label>電話<input id="phone"></label><label>住所<input id="address"></label><label>メール<input id="email"></label></div>
<div class="services"><b>今回の業務</b><div id="serviceButtons"></div></div>
<div id="serviceArea"></div>
<div class="total"><span>差引</span><b id="total">¥0</b></div>
</div><footer><button id="customerPreview">お客様確認</button><button id="saveDraft">下書き保存</button></footer></section></div>
<div id="preview" class="overlay"><section class="sheet preview"><header><b>お客様確認</b><button data-close="preview">×</button></header><div id="previewBody" class="body"></div></section></div>
<script src="./app.js"></script></body></html>
