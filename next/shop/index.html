<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f8878"><title>買取レスキュー 販売</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="shopTop"><div><b>買取レスキュー</b><span>販売商品</span></div><button id="backNext" type="button">NEXTへ</button></header>
<main>
<section id="previewBanner" class="previewBanner hidden">プレビューモード｜まだ公開されていません</section>
<section class="shopHero"><div><h1>次に使う人へ、家電のバトン。</h1><p>動作確認・清掃を行った販売中の商品を掲載しています。</p></div></section>
<section id="catalogControls" class="catalogControls"><input id="catalogSearch" placeholder="メーカー・型番・カテゴリを検索"><div id="catalogCategories" class="catalogCategories"></div></section>
<div class="catalogMeta"><b id="catalogCount">0件</b><span id="catalogState"></span></div>
<section id="catalogGrid" class="catalogGrid"></section>
</main>
<div id="productModal" class="productOverlay"><section class="productSheet"><button id="closeProduct" class="closeProduct">×</button><div id="productPhoto" class="productPhoto"></div><div class="productBody"><span id="productCategory" class="productCategory"></span><h2 id="productTitle"></h2><div id="productPrice" class="productPrice"></div><div id="productSpec" class="productSpec"></div><p id="productDescription"></p><small id="productInventoryNo"></small></div></section></div>
<script src="./app.js"></script></body></html>
