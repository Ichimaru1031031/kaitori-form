<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f8878"><title>買取レスキュー 販売</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="shopTop"><div><b>買取レスキュー</b><span>販売商品</span></div><div class="shopTopActions"><button id="cartButton" class="cartButton" type="button">カート <strong id="cartCount">0</strong></button><button id="backNext" class="hidden" type="button">NEXTへ</button></div></header>
<main>
<section id="previewBanner" class="previewBanner hidden">プレビューモード｜まだ公開されていません</section><section id="checkoutMessage" class="checkoutMessage hidden"></section>
<section class="shopHero"><div><h1>次に使う人へ、家電のバトン。</h1><p>動作確認・清掃を行った販売中の商品を掲載しています。</p></div></section>
<section id="catalogControls" class="catalogControls"><input id="catalogSearch" placeholder="メーカー・型番・カテゴリを検索"><div id="catalogCategories" class="catalogCategories"></div></section>
<div class="catalogMeta"><b id="catalogCount">0件</b><span id="catalogState"></span></div>
<section id="catalogGrid" class="catalogGrid"></section>
</main>
<div id="productModal" class="productOverlay"><section class="productSheet"><button id="closeProduct" class="closeProduct">×</button><div id="productPhoto" class="productPhoto"></div><div class="productBody"><span id="productCategory" class="productCategory"></span><h2 id="productTitle"></h2><div id="productPrice" class="productPrice"></div><div id="productSpec" class="productSpec"></div><p id="productDescription"></p><small id="productInventoryNo"></small><button id="addToCart" class="addToCart" type="button">カートに入れる</button></div></section></div><div id="cartOverlay" class="productOverlay"><section class="cartSheet"><button id="closeCart" class="closeProduct">×</button><header><div><b>カート</b><small>1点ものの商品です</small></div></header><div class="cartBody"><div id="cartItems" class="cartItems"></div><div class="cartTotals"><div><span>商品合計</span><b id="cartSubtotal">¥0</b></div><div><span>配送費</span><b id="cartShipping">¥0</b></div><div class="grand"><span>合計</span><b id="cartTotal">¥0</b></div></div><section class="deliveryOptions"><b>受取方法</b><label><input type="radio" name="deliveryOption" value="pickup" checked> 店頭受取</label><label><input type="radio" name="deliveryOption" value="nagareyama"> 流山市内配送</label><label><input type="radio" name="deliveryOption" value="kashiwa"> 柏市内配送</label><label><input type="radio" name="deliveryOption" value="other"> その他地域（要相談）</label></section><label class="cartEmail">メールアドレス（任意）<input id="checkoutEmail" type="email" autocomplete="email" placeholder="name@example.com"></label><div id="checkoutError" class="checkoutError hidden"></div><button id="checkoutButton" class="checkoutButton" type="button">Stripeで決済へ</button><small class="checkoutNote">配送の場合、決済画面で住所・電話番号を入力します。</small></div></section></div>
<script src="./config.js"></script><script src="./app.js"></script></body></html>
