<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#103d2c" />
    <title>査定｜買取レスキュー NEXT</title>
    <style>
      :root {
        --header-height: 56px;
        --gas-banner-height: 0px;
        --legacy-menu-left: 82px;
        --legacy-menu-bottom: 0px;
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f4f7f5;
      }
      .nextHeader {
        position: fixed;
        z-index: 3;
        inset: 0 0 auto;
        height: calc(var(--header-height) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 12px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        background: linear-gradient(135deg, #103d2c, #0b2e40);
        box-shadow: 0 3px 14px rgba(5, 31, 23, 0.2);
      }
      .backButton {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 13px;
        color: inherit;
        background: rgba(255, 255, 255, 0.1);
        font-size: 24px;
        line-height: 1;
      }
      .title { min-width: 0; display: grid; gap: 2px; }
      .title b { font-size: 16px; }
      .title small {
        overflow: hidden;
        color: #cde6da;
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .live {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        color: #d8f3e7;
        font-size: 11px;
        white-space: nowrap;
      }
      .live::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #50d993;
        content: "";
      }
      .frameCrop {
        position: fixed;
        inset: calc(var(--header-height) + env(safe-area-inset-top)) 0 0;
        overflow: hidden;
        background: #f4f7f5;
      }
      #assessmentFrame {
        position: absolute;
        top: calc(-1 * var(--gas-banner-height));
        left: calc(-1 * var(--legacy-menu-left));
        width: calc(100% + var(--legacy-menu-left));
        height: calc(100% + var(--gas-banner-height) + var(--legacy-menu-bottom));
        border: 0;
        background: #f4f7f5;
      }
      .loading {
        position: fixed;
        z-index: 2;
        inset: calc(var(--header-height) + env(safe-area-inset-top)) 0 0;
        display: grid;
        place-content: center;
        gap: 7px;
        text-align: center;
        color: #35564a;
        background: #f4f7f5;
        transition: opacity 0.18s ease;
      }
      .loading.hide { opacity: 0; pointer-events: none; }
      .loading b { font-size: 15px; }
      .loading span { font-size: 12px; }
      @media (max-width: 760px) {
        :root {
          --legacy-menu-left: 0px;
          --legacy-menu-bottom: 76px;
        }
        .live { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="nextHeader">
      <button class="backButton" id="backButton" type="button" aria-label="NEXT査定に戻る">‹</button>
      <div class="title">
        <b>査定ダッシュボード</b>
        <small id="caseLabel">Blue本番データ</small>
      </div>
      <span class="live">Blueライブ接続</span>
    </header>
    <div class="frameCrop">
      <iframe id="assessmentFrame" title="査定ダッシュボード" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="loading" id="loading">
      <b>査定データを開いています</b>
      <span>既存のスプレッドシート・LINE経路を使用します</span>
    </div>
    <script>
      (() => {
        const BLUE_DASHBOARD = "https://script.google.com/macros/s/AKfycby5yXQfe2Ki8V3TXqNTj1by9GtRZEo4a-yfdvsQ0e2k-EaUwnoeBpnprpRX1LjkMSUI/exec";
        const params = new URLSearchParams(location.search);
        const caseId = String(params.get("case") || "").replace(/^(?:BLUE-CASE-|BLUE-SLIP-CASE-)/, "");
        const dashboard = new URL(BLUE_DASHBOARD);
        dashboard.searchParams.set("embed", "1");
        dashboard.searchParams.set("from", "next");
        if (caseId) {
          dashboard.searchParams.set("case", caseId);
          document.querySelector("#caseLabel").textContent = caseId + " ・ Blue本番データ";
        }
        const isAppleMobile =
          /iPad|iPhone|iPod/.test(navigator.userAgent || "") ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isAppleMobile) {
          location.replace(dashboard.toString());
          return;
        }
        const frame = document.querySelector("#assessmentFrame");
        frame.addEventListener("load", () => document.querySelector("#loading").classList.add("hide"));
        frame.src = dashboard.toString();
        document.querySelector("#backButton").addEventListener("click", () => {
          if (history.length > 1) history.back();
          else location.replace("./");
        });
      })();
    </script>
  </body>
</html>
