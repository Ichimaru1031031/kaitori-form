const stage=document.getElementById('stage'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText'),loadingAro=document.getElementById('loadingAro'),currentTitle=document.getElementById('currentTitle'),frames={},dirty=new Set();const loadingSources=['assets/aro-loading.webp','assets/aro-loading-box.webp'];let currentApp='',touchCounter=0,lastLoading=-1,warmStarted=false;function chooseLoadingAro(){let next=Math.floor(Math.random()*loadingSources.length);if(loadingSources.length>1&&next===lastLoading)next=(next+1)%loadingSources.length;lastLoading=next;loadingAro.classList.toggle('boxVersion',next===1);loadingAro.src=loadingSources[next]}window.addEventListener('message',e=>{if(!e.data)return;if(e.data.type==='kr-inventory-changed'){if(e.data.source!=='inventory')dirty.add('inventory');dirty.add('store')}if(e.data.type==='kr-slip-changed'){['schedule','slips','inventory','store'].forEach(x=>dirty.add(x))}if(e.data.type==='kr-refresh-hub'){const target=urls[currentApp]?currentApp:'inventory';Object.keys(frames).forEach(k=>{frames[k].remove();delete frames[k]});dirty.clear();warmStarted=false;show(target)}if(e.data.type==='kr-open-slip'&&e.data.slipId)openSlip(e.data.slipId);if(e.data.type==='kr-edit-slip'&&e.data.slipId)editSlip(e.data.slipId);if(e.data.type==='kr-back-slips')backToSlips();if(e.data.type==='kr-schedule-to-slip'){if(e.data.caseId)startSlipFromCase(e.data.caseId);else if(e.data.slipId)editSlip(e.data.slipId);else if(e.data.scheduleId)startSlipFromSchedule(e.data.scheduleId)}if(e.data.type==='kr-create-slip'||e.data.type==='kr-open-slip-create'){if(e.data.caseId||e.data.customerId)startSlipFromCase(e.data.caseId||e.data.customerId);else openCustomerPicker()}});
let customerCases=[];
const HUB_NOTICE_KEY='kr_hub_assessment_notice_v2';
const HUB_NOTICE_ARO='assets/aro-notification.webp';
const HUB_NOTICE_CANCEL_ARO='assets/aro-notification-cancel.webp';
let hubNoticePolling=false;
function hubNoticeState(){try{return JSON.parse(localStorage.getItem(HUB_NOTICE_KEY)||'null')}catch(_e){return null}}
function saveHubNoticeState(items){const snapshot={version:2,updatedAt:Date.now(),items:{}};(items||[]).forEach(x=>{const events=x.customerEvents||{};snapshot.items[x.id]={status:x.status||'',eventFingerprints:{confirmed:events.confirmed&&events.confirmed.fingerprint||'',reschedule:events.reschedule&&events.reschedule.fingerprint||'',cancel:events.cancel&&events.cancel.fingerprint||''}}});try{localStorage.setItem(HUB_NOTICE_KEY,JSON.stringify(snapshot))}catch(_e){}}
function removeHubNotice(card){if(!card)return;card.classList.add('removing');setTimeout(()=>card.remove(),210)}
function openHubNotice(caseId,card){removeHubNotice(card);show('dashboard');const f=ensure('dashboard'),send=()=>{try{f.contentWindow.postMessage({type:'kr-open-assessment-case',caseId},'*')}catch(_e){}};if(f.dataset.loaded==='1')setTimeout(send,250);else f.addEventListener('load',send,{once:true})}
function showHubNotice(item,kind){const host=document.getElementById('hubNotices');while(host.children.length>=3)host.firstElementChild.remove();const card=document.createElement('article'),copy={new:{tag:'新規申込',title:'新規申し込みが入りました',message:'出張買取の申し込みがありました。'},confirmed:{tag:'日時確定',title:'訪問日時の確定がありました。',message:'お客様が訪問日時を確定しました。'},reschedule:{tag:'予約変更',title:'予約変更の希望がありました。',message:'お客様から予約日時の変更希望が届きました。'},cancel:{tag:'キャンセル',title:'キャンセルの連絡がありました。',message:'お客様からキャンセルの連絡が届きました。'},reply:{tag:'顧客からの返信',title:'お客様から返信がありました',message:'返信内容を確認してください。'}},c=copy[kind]||copy.reply,events=item.customerEvents||{},eventDetail=(events[kind]&&events[kind].detail||[]).map(x=>x.label+' '+x.value).join(' ／ '),detail=[item.name&&item.name+' 様',item.id,item.product].filter(Boolean).join('　'),aro=kind==='cancel'?HUB_NOTICE_CANCEL_ARO:HUB_NOTICE_ARO;card.className='hubNotice '+kind;card.tabIndex=0;card.setAttribute('aria-label',c.title+'。'+detail+'。クリックして該当案件を確認');card.innerHTML='<button type="button" class="hubNoticeClose" aria-label="通知を閉じる">×</button><span class="hubNoticePulse" aria-hidden="true"></span><img class="hubNoticeAro" alt="'+customerEsc(kind==='cancel'?'キャンセルを知らせるアロさん':'新着を知らせるアロさん')+'" src="'+aro+'"><div class="hubNoticeBody"><span class="hubNoticeKind">'+customerEsc(c.tag)+'</span><strong>'+customerEsc(c.title)+'</strong><b>'+customerEsc(detail)+'</b><p>'+customerEsc(eventDetail||c.message)+'</p><button type="button" class="hubNoticeOpen">該当案件を確認</button></div>';const open=()=>openHubNotice(item.id,card);card.onclick=open;card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();open()}};card.querySelector('.hubNoticeClose').onclick=e=>{e.stopPropagation();removeHubNotice(card)};card.querySelector('.hubNoticeOpen').onclick=e=>{e.stopPropagation();open()};host.appendChild(card);setTimeout(()=>removeHubNotice(card),15000)}
function applyHubAssessmentNotifications(result){const items=result&&result.items||[],saved=hubNoticeState();if(!saved||saved.version!==2){saveHubNoticeState(items);return}const old=saved.items||{},notices=[];items.slice().reverse().forEach(item=>{const before=old[item.id];if(!before){notices.push({item,kind:'new'});return}const current=item.customerEvents||{},previous=before.eventFingerprints||{},changed=type=>current[type]&&current[type].active&&current[type].fingerprint!==previous[type];if(changed('cancel'))notices.push({item,kind:'cancel'});else if(changed('reschedule'))notices.push({item,kind:'reschedule'});else if(changed('confirmed'))notices.push({item,kind:'confirmed'})});saveHubNoticeState(items);notices.slice(-3).forEach(x=>showHubNotice(x.item,x.kind))}
function pollHubAssessmentNotifications(){if(hubNoticePolling||document.hidden)return;hubNoticePolling=true;if(!requestBridge('notifications'))setTimeout(()=>{hubNoticePolling=false;pollHubAssessmentNotifications()},700)}
function customerEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCustomerCases(){const q=(document.getElementById('customerSearch').value||'').toLowerCase(),rows=customerCases.filter(x=>!q||[x.id,x.name,x.phone,x.status,x.product].join(' ').toLowerCase().includes(q));document.getElementById('customerList').innerHTML=rows.length?rows.map(x=>'<button type="button" class="customerRow" data-case="'+customerEsc(x.id)+'"><span><b>'+customerEsc(x.name||'氏名未登録')+'</b><span>'+customerEsc(x.id)+'　'+customerEsc(x.phone)+'</span><small>'+customerEsc([x.product,x.date].filter(Boolean).join(' ／ '))+'</small></span><em>'+customerEsc(x.status||'選択')+'</em></button>').join(''):'<div class="customerEmpty">該当する顧客がありません。</div>';document.querySelectorAll('.customerRow').forEach(b=>b.onclick=()=>startSlipFromCase(b.dataset.case))}
function openCustomerPicker(){const modal=document.getElementById('customerPicker');modal.classList.add('on');modal.setAttribute('aria-hidden','false');document.getElementById('customerSearch').value='';if(customerCases.length)return renderCustomerCases();document.getElementById('customerList').innerHTML='<div class="customerEmpty">顧客データを読み込み中…</div>';if(!requestBridge('customers'))setTimeout(()=>requestBridge('customers'),700)}
function closeCustomerPicker(){const modal=document.getElementById('customerPicker');modal.classList.remove('on');modal.setAttribute('aria-hidden','true')}
function startSlipFromSchedule(scheduleId){if(!scheduleId)return;const f=ensure('slip'),u=new URL(urls.slip);u.searchParams.set('schedule',scheduleId);u.searchParams.set('_schedule',Date.now());f.dataset.loaded='';f.src=u.toString();show('slip')}

document.getElementById('customerSearch').addEventListener('input',renderCustomerCases);document.getElementById('customerPicker').addEventListener('click',e=>{if(e.target.id==='customerPicker')closeCustomerPicker()});
function trimFrames(){
  const keepLimit=4;
  const removable=Object.entries(frames)
    .filter(([app])=>app!==currentApp&&app!=='slip'&&!dirty.has(app))
    .sort((a,b)=>Number(a[1].dataset.touched||0)-Number(b[1].dataset.touched||0));
  while(Object.keys(frames).length>keepLimit&&removable.length){
    const [app,frame]=removable.shift();
    frame.remove();delete frames[app];
  }
}
function warmCommonScreens(){
  if(warmStarted)return;
  const connection=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(connection&&(connection.saveData||/2g/.test(connection.effectiveType||'')))return;
  warmStarted=true;
  const priority=currentApp==='slip'?['inventory','slips']:currentApp==='slips'?['slip','inventory']:currentApp==='inventory'?['slip','slips']:['inventory','slip'];
  const queue=priority.filter(app=>!frames[app]);
  const next=()=>{const app=queue.shift();if(!app)return;const frame=ensure(app);if(frame.dataset.loaded==='1')return next();frame.addEventListener('load',()=>setTimeout(next,250),{once:true})};
  const idle=window.requestIdleCallback||function(cb){return setTimeout(cb,900)};
  idle(next,{timeout:2400});
}
function ensure(app){if(frames[app]){frames[app].dataset.touched=String(++touchCounter);return frames[app]}const button=document.querySelector('[data-app="'+app+'"]'),f=document.createElement('iframe');f.className='view';f.title=button.getAttribute('aria-label');f.dataset.touched=String(++touchCounter);f.src=urls[app];f.addEventListener('load',()=>{f.dataset.loaded='1';if(f.classList.contains('active')){loading.classList.add('hide');warmCommonScreens()}trimFrames()});stage.appendChild(f);frames[app]=f;return f}
function openSlip(slipId){const f=ensure('slips'),u=new URL(BASE+'?page=slipdetail&embed=1');u.searchParams.set('slip',slipId);u.searchParams.set('_open',Date.now());f.dataset.loaded='';f.src=u.toString();show('slips')}function editSlip(slipId){const f=ensure('slip'),u=new URL(urls.slip);u.searchParams.set('slip',slipId);u.searchParams.set('_edit',Date.now());f.dataset.loaded='';f.src=u.toString();show('slip')}function backToSlips(){const f=ensure('slips'),u=new URL(urls.slips);u.searchParams.set('_list',Date.now());f.dataset.loaded='';f.src=u.toString();show('slips')}
function show(app){const button=document.querySelector('[data-app="'+app+'"]');if(!button||!urls[app])return;const cached=!!(frames[app]&&frames[app].dataset.loaded==='1'&&!dirty.has(app));if(cached)loading.classList.add('hide');else{chooseLoadingAro();loading.classList.remove('hide');loadingText.textContent=button.getAttribute('aria-label')+'を準備しています'}currentTitle.textContent=button.getAttribute('aria-label');document.getElementById('dashboardQuickSlip').classList.remove('on');document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.app===app;b.setAttribute('aria-selected',String(on));b.classList.toggle('active',on)});Object.entries(frames).forEach(([k,f])=>f.classList.toggle('active',k===app));const f=ensure(app);if(dirty.has(app)&&f.dataset.loaded==='1'){dirty.delete(app);f.dataset.loaded='';const fresh=new URL(urls[app]);fresh.searchParams.set('_sync',Date.now());f.src=fresh.toString()}requestAnimationFrame(()=>{f.classList.add('active');if(f.dataset.loaded==='1')loading.classList.add('hide')});currentApp=app;trimFrames();const u=new URL(location.href);u.searchParams.delete('page');u.searchParams.set('tab',app);history.replaceState(null,'',u)}
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',e=>{e.preventDefault();const app=b.dataset.app;if(MOBILE_DIRECT&&app!=='recycle'){location.assign(mobileDirectUrl(app));return}show(app)});
  // PCではクリック前、カーソルを合わせた時点で対象画面を先読みします。
  if(matchMedia('(hover:hover) and (pointer:fine)').matches)b.addEventListener('pointerenter',()=>ensure(b.dataset.app),{once:true});
});
const initial=(new URLSearchParams(location.search).get('tab')||'schedule');if(MOBILE_DIRECT&&initial!=='recycle')location.replace(mobileDirectUrl(urls[initial]?initial:'schedule'));else show(urls[initial]?initial:'schedule');
pollHubAssessmentNotifications();setInterval(pollHubAssessmentNotifications,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollHubAssessmentNotifications()});
